<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carnada · Links</title>
<meta name="description" content="Carnada — Hard Trance &amp; Hard Bounce. Music, sets and booking.">
<meta property="og:type" content="website">
<meta property="og:title" content="Carnada">
<meta property="og:description" content="Hard Trance · Hard Bounce. Music, sets and booking.">
<meta property="og:url" content="https://carnada.link/">
<meta name="theme-color" content="#070a04">
<style>
:root{--bg:#070a04;--lime:#c0ff00;--lime-dim:#6e9600;--text:#eaf5d0;--muted:#9db07a;--glass:rgba(255,255,255,.07);--glass-b:rgba(255,255,255,.22)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:dark}
body{margin:0;min-height:100vh;color:var(--text);background:var(--bg);font:16px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background-image:radial-gradient(520px 420px at 12% 8%,rgba(192,255,0,.40),transparent 70%),radial-gradient(560px 460px at 92% 92%,rgba(120,200,0,.32),transparent 70%),radial-gradient(420px 320px at 85% 10%,rgba(60,120,0,.35),transparent 70%);background-attachment:fixed}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
a{color:inherit}
.wrap{max-width:600px;margin:0 auto;padding:40px 16px 64px}
header{text-align:center;margin-bottom:28px}
pre.logo{margin:0 auto 12px;display:block;width:max-content;max-width:100%;overflow:hidden;color:var(--lime);font-weight:700;line-height:1.05;font-size:min(11px,calc((100vw - 32px)/52));text-shadow:0 0 10px rgba(192,255,0,.55);white-space:pre;text-align:left;min-height:17em}
pre.logo.on{animation:glow 2.6s ease-out}
.tagline{margin:0 0 20px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;font-size:13px;opacity:0;animation:up .8s ease 1.3s forwards}
.socials{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;opacity:0;animation:up .8s ease 1.5s forwards}
@keyframes glow{0%{text-shadow:0 0 26px #c0ff00,0 0 70px rgba(192,255,0,.85)}100%{text-shadow:0 0 10px rgba(192,255,0,.55)}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.glass{background:var(--glass);border:1px solid var(--glass-b);border-radius:24px;-webkit-backdrop-filter:blur(22px) saturate(140%);backdrop-filter:blur(22px) saturate(140%);box-shadow:0 18px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.28)}
main{opacity:0;animation:up .8s ease 1.7s forwards}
section{margin-top:34px}
h2{margin:0 0 12px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--lime);font-weight:700}
.stack{display:grid;gap:14px}
.pill{display:inline-block;text-decoration:none;font-size:14px;padding:8px 18px;border-radius:999px;border:1px solid var(--glass-b);background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:transform .15s,border-color .15s,box-shadow .15s}
.pill:hover,.pill:focus-visible{transform:translateY(-1px);border-color:var(--lime);box-shadow:0 0 18px rgba(192,255,0,.35);outline:none}
.pill:focus-visible,.btn:focus-visible,.facade:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.btn{display:inline-block;text-decoration:none;font:inherit;font-weight:700;font-size:14px;color:#0b1000;background:var(--lime);padding:9px 18px;border:0;border-radius:14px;cursor:pointer;box-shadow:0 0 18px rgba(192,255,0,.35);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 0 28px rgba(192,255,0,.6)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--glass-b);box-shadow:none}
.btn.small{padding:6px 14px;font-size:13px;border-radius:12px}
.btn.big{display:block;width:100%;text-align:center;font-size:17px;padding:16px 20px;border-radius:18px}
.book-opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.opt{display:block;padding:18px 14px;text-align:center;text-decoration:none;transition:transform .15s,border-color .15s}
.opt:hover,.opt:focus-visible{transform:translateY(-1px);border-color:var(--lime);outline:none}
.opt:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.opt b{display:block;font-size:20px;color:var(--lime)}
.opt span{display:block;margin-top:4px;font-size:12px;color:var(--muted);word-break:break-all}
.player{padding:10px}
.player iframe{display:block;width:100%;height:352px;border:0;border-radius:16px;background:transparent}
.rel{padding:14px;display:flex;gap:14px;align-items:center}
.rel img{width:84px;height:84px;flex:none;border-radius:14px;object-fit:cover;background:#0b1206;border:1px solid var(--glass-b)}
.rel h3{margin:0;font-size:17px;line-height:1.25}
.rel .by{margin:0 0 10px;color:var(--muted);font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.vid{padding:12px}
.vid h3{margin:10px 4px 4px;font-size:14px;line-height:1.35}
.vid a.alt{font-size:12px;color:var(--muted);margin:0 4px}
.facade{position:relative;display:block;width:100%;aspect-ratio:16/9;padding:0;border:0;border-radius:16px;overflow:hidden;cursor:pointer;background:#0b1206}
.facade img{width:100%;height:100%;object-fit:cover;display:block;opacity:.85;transition:opacity .2s,transform .3s}
.facade:hover img,.facade:focus-visible img{opacity:1;transform:scale(1.02)}
.facade .play{position:absolute;inset:0;margin:auto;width:64px;height:64px;border-radius:50%;background:var(--lime);box-shadow:0 0 30px rgba(192,255,0,.6);display:flex;align-items:center;justify-content:center}
.facade .play::after{content:"";margin-left:5px;border-left:20px solid #0b1000;border-top:12px solid transparent;border-bottom:12px solid transparent}
.vid iframe{display:block;width:100%;aspect-ratio:16/9;border:0;border-radius:16px}
.more{padding:16px 18px;display:flex;justify-content:space-between;gap:14px;align-items:center;text-decoration:none;transition:transform .15s,border-color .15s}
.more:hover,.more:focus-visible{transform:translateY(-1px);border-color:var(--lime);outline:none}
.more:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.more b{display:block;font-size:16px}
.more span{color:var(--muted);font-size:13px}
.more i{font-style:normal;color:var(--lime);font-size:20px}
.empty{padding:24px;text-align:center;color:var(--muted)}
footer{margin-top:44px;text-align:center;color:var(--muted);font-size:12px;opacity:0;animation:up .8s ease 2s forwards}
footer p{margin:0 0 6px}
footer b{color:var(--lime-dim)}
@media (max-width:420px){.rel{flex-direction:column;text-align:center}.rel .row{justify-content:center}.book-opts{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.tagline,.socials,main,footer{opacity:1;animation:none}pre.logo.on{animation:none}.facade img,.pill,.btn,.more,.opt{transition:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1 class="sr">Carnada</h1>
<pre class="logo" id="logo" role="img" aria-label="CARNADA"></pre>
<p class="tagline" id="tagline"></p>
<ul class="socials" id="socials" aria-label="Social profiles"></ul>
</header>
<main id="main" aria-live="polite">
<noscript><div class="glass empty">Enable JavaScript to see the links.</div></noscript>
</main>
<footer>
<p>YouTube loads only when you press play.</p>
<p><b>&gt;</b> Carnada</p>
</footer>
</div>
<script>
var LOGO=[
'      ..         ###     ##.         #.               ###   ###               ###',
'    .###.       .###     .##.       ###              ####   .###.            .###',
'   ###          ####     ####.     .###    ##.      .###.   .#####.          ####',
'  .##          #####    .##.###    ####    ##.      ####.   .##..###        #####',
'  ###          #####    ###  ###   #####   ##.     .####.   .##   ###       #####',
' .##          ######    ##.  .###  #####   ##.     #####.    ##    ###     ######',
' ###         ### ###    ########.  ##.###  ##.    ### ##.    ##     ##    ### ###',
'.##         .##  ###    #####.    .## .##  ##    ###  ###    ##    ###   .##  ###',
'###        .###..###.  .## .##    .##  ##..##   .###..###    ##   .##.  .###..###.',
'##.       .############.##  ###   .##  .#####  ############. ##.  ##.  .############',
'###     . .##     ##.  .##   ###  .##   ####.  ###    .##    ##. ##.   .##     ##.',
'.##   .##.##.     ###  .##    ### .##   .###. .##      ##.   ######    ###     ###',
' ###.###.###      .##  .##     ###.##    ###  ###      ###   #####    ###      .##',
'  #####  .         ##   ##      ##.       ..  .         #.   .###      .        ##',
'                                ###                         .##.',
'                                 ###                         .'
];
var lg=document.getElementById('logo'),FULL=LOGO.join('\n');
lg.textContent=FULL;
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
if(reduce){lg.classList.add('on')}
else{
lg.style.width=lg.offsetWidth+'px';
var W=Math.max.apply(null,LOGO.map(function(r){return r.length})),G='#.:+*01/',t0=null;
var T=LOGO.map(function(r){return r.split('').map(function(_,c){return c/W*1200+Math.random()*350})});
var frame=function(ts){
if(t0===null)t0=ts;
var el=ts-t0,done=true;
var out=LOGO.map(function(r,i){var s='';for(var c=0;c<r.length;c++){var ch=r[c];if(ch===' '){s+=' ';continue}var tt=T[i][c];if(el>=tt+350){s+=ch}else{done=false;s+=el>=tt?G[Math.floor(Math.random()*G.length)]:' '}}return s}).join('\n');
lg.textContent=out;
if(!done){requestAnimationFrame(frame)}else{lg.textContent=FULL;lg.style.width='';lg.classList.add('on')}
};
lg.textContent=LOGO.map(function(r){return r.replace(/\S/g,' ')}).join('\n');
requestAnimationFrame(frame);
}
var ICON='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect x="4" y="4" width="92" height="92" rx="22" fill="#0b1206"/><rect x="4" y="4" width="92" height="92" rx="22" fill="none" stroke="#c0ff00" stroke-opacity=".6" stroke-width="2"/><text x="50" y="57" text-anchor="middle" font-family="monospace" font-weight="700" font-size="30" fill="#c0ff00">C</text></svg>';
var fav=document.createElement('link');fav.rel='icon';fav.href='data:image/svg+xml,'+encodeURIComponent(ICON);document.head.appendChild(fav);

function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function link(cls,text,url){var a=el('a',cls,text);a.href=url;a.target='_blank';a.rel='noopener noreferrer';return a}
function section(title,id){var s=el('section');s.setAttribute('aria-labelledby',id);var h=el('h2',null,title);h.id=id;s.appendChild(h);return s}

function spotifyPlayer(id){
var box=el('div','glass player');
var f=document.createElement('iframe');
f.src='https://open.spotify.com/embed/artist/'+encodeURIComponent(id)+'?utm_source=generator&theme=0';
f.height='352';f.title='Spotify player: Carnada';f.loading='lazy';
f.allow='autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture';
box.appendChild(f);return box;
}

function release(r){
var c=el('article','glass rel');
var im=el('img');im.src=r.cover;im.alt='Cover: '+r.title;im.width=84;im.height=84;im.loading='lazy';
var d=el('div');
d.appendChild(el('h3',null,r.title));
d.appendChild(el('p','by',r.artist));
var row=el('div','row');
(r.links||[]).forEach(function(l){row.appendChild(link('btn small ghost',l.label,l.url))});
d.appendChild(row);
c.appendChild(im);c.appendChild(d);return c;
}

function booking(b){
var s=el('section');s.setAttribute('aria-label','Booking');
var t=el('button','btn big');t.type='button';
t.setAttribute('aria-expanded','false');t.setAttribute('aria-controls','book-opts');
t.appendChild(el('span',null,b.label||'Booking'));
var ar=el('span',null,' ▾');ar.setAttribute('aria-hidden','true');t.appendChild(ar);
var panel=el('div','book-opts');panel.id='book-opts';panel.hidden=true;
(b.options||[]).forEach(function(o){
var href=o.url;
if(o.email){
href='mailto:'+o.email;var q=[];
if(o.subject)q.push('subject='+encodeURIComponent(o.subject));
if(o.body)q.push('body='+encodeURIComponent(o.body.replace(/\n/g,'\r\n')));
if(q.length)href+='?'+q.join('&');
}
var a=el('a','glass opt');a.href=href;
if(!o.email){a.target='_blank';a.rel='noopener noreferrer'}
a.appendChild(el('b',null,o.label));
if(o.note)a.appendChild(el('span',null,o.note));
panel.appendChild(a);
});
t.addEventListener('click',function(){
var open=t.getAttribute('aria-expanded')==='true';
t.setAttribute('aria-expanded',open?'false':'true');
panel.hidden=open;ar.textContent=open?' ▾':' ▴';
});
s.appendChild(t);s.appendChild(panel);return s;
}

function video(s){
var c=el('article','glass vid');
var fb=el('button','facade');fb.type='button';fb.setAttribute('aria-label','Play: '+s.title);
var im=el('img');im.src=s.thumb||('https://i.ytimg.com/vi/'+s.youtube+'/hqdefault.jpg');im.alt='';im.loading='lazy';
fb.appendChild(im);fb.appendChild(el('span','play'));
fb.addEventListener('click',function(){
var f=document.createElement('iframe');
f.src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(s.youtube)+'?autoplay=1&rel=0';
f.title=s.title;f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';f.allowFullscreen=true;
fb.replaceWith(f);f.focus();
});
c.appendChild(fb);
c.appendChild(el('h3',null,s.title));
c.appendChild(link('alt','Watch on YouTube','https://www.youtube.com/watch?v='+encodeURIComponent(s.youtube)));
return c;
}

fetch('links.json',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
document.title=d.name?d.name.charAt(0)+d.name.slice(1).toLowerCase()+' · Links':document.title;
document.getElementById('tagline').textContent=d.tagline||'';
var so=document.getElementById('socials');
(d.socials||[]).forEach(function(s){var li=el('li');li.appendChild(link('pill',s.label,s.url));so.appendChild(li)});
var m=document.getElementById('main');
if(d.booking&&d.booking.options)m.appendChild(booking(d.booking));

if(d.spotifyArtist||(d.releases&&d.releases.length)){
var s1=section('Music','h-music'),st=el('div','stack');
if(d.spotifyArtist)st.appendChild(spotifyPlayer(d.spotifyArtist));
(d.releases||[]).forEach(function(r){st.appendChild(release(r))});
s1.appendChild(st);m.appendChild(s1);
}
if(d.sets&&d.sets.length){
var s2=section('Latest sets','h-sets'),st2=el('div','stack');
d.sets.forEach(function(v){st2.appendChild(video(v))});
s2.appendChild(st2);m.appendChild(s2);
}
if(d.more&&d.more.length){
var s4=section('More','h-more'),st4=el('div','stack');
d.more.forEach(function(x){
var a=el('a','glass more');a.href=x.url;a.target='_blank';a.rel='noopener noreferrer';
var t=el('div');t.appendChild(el('b',null,x.label));if(x.note)t.appendChild(el('span',null,x.note));
a.appendChild(t);var ar=el('i','','→');ar.setAttribute('aria-hidden','true');a.appendChild(ar);
st4.appendChild(a);
});
s4.appendChild(st4);m.appendChild(s4);
}
}).catch(function(){document.getElementById('main').innerHTML='<div class="glass empty">Could not load the links.</div>'});
</script>
</body>
</html>
