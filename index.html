function soc(s){
var k=String(s.label||'').toLowerCase().replace(/[^a-z]/g,''),p=ICONS[k];
if(!p)return link('pill',s.label,s.url);
var a=link('soc','',s.url);a.setAttribute('aria-label',s.label);a.title=s.label;
var NS='http://www.w3.org/2000/svg',v=document.createElementNS(NS,'svg');v.setAttribute('viewBox','0 0 24 24');v.setAttribute('aria-hidden','true');
var q=document.createElementNS(NS,'path');q.setAttribute('d',p);v.appendChild(q);a.appendChild(v);return a;
}
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function link(cls,text,url){var a=el('a',cls,text);a.href=url;a.target='_blank';a.rel='noopener noreferrer';return a}
function section(title,id){var s=el('section');s.setAttribute('aria-labelledby',id);var h=el('h2',null,title);h.id=id;s.appendChild(h);return s}

var CK='carnada-consent',consent=null,renderers=[];
function getC(){try{return localStorage.getItem(CK)}catch(e){return null}}
function setC(v){consent=v;try{localStorage.setItem(CK,v)}catch(e){}}
consent=getC();
function hideBanner(){var c=document.getElementById('cookie');if(c)c.remove()}
function decide(v){
setC(v);hideBanner();
renderers.forEach(function(r){r()});
var p=document.querySelector('.player');if(p)p.focus();
}
function showBanner(){
if(document.getElementById('cookie'))return;
var c=el('div','glass');c.id='cookie';c.setAttribute('role','region');c.setAttribute('aria-label','Cookie preferences');
c.appendChild(el('p',null,'This page can show Spotify’s player, which uses cookies. Accept to load it. YouTube loads only when you press play.'));
var row=el('div','row');
var no=el('button','btn small','Reject');no.type='button';
var ok=el('button','btn small','Accept');ok.type='button';
no.addEventListener('click',function(){decide('no')});
ok.addEventListener('click',function(){decide('yes')});
row.appendChild(no);row.appendChild(ok);c.appendChild(row);document.body.appendChild(c);
}

function spotifyPlayer(sp){
var wrap=el('div','stack');
var box=el('div','glass player');box.tabIndex=-1;
var acts=el('div','row');
var cur=0;
function src(i){return 'https://open.spotify.com/embed/'+sp.items[i].uri+'?utm_source=generator&theme=0'}
function drawActs(){
acts.textContent='';
if(sp.follow)acts.appendChild(link('btn ghost','Follow on Spotify',sp.follow));
(sp.items[cur].links||[]).forEach(function(l){acts.appendChild(link('btn ghost',l.label,l.url))});
}
function draw(){
box.textContent='';
if(consent==='yes'){
box.className='glass player';
var tabs=el('div','tabs');tabs.setAttribute('role','group');tabs.setAttribute('aria-label','Choose what to play');
var f=document.createElement('iframe');
f.src=src(cur);f.height='352';f.title='Spotify player: Carnada';f.loading='lazy';
f.allow='autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture';
var ind=el('span','tab-ind');ind.setAttribute('aria-hidden','true');tabs.appendChild(ind);
var btns=[];
function place(){var b=btns[cur];if(b&&b.offsetWidth){ind.style.width=b.offsetWidth+'px';ind.style.transform='translateX('+b.offsetLeft+'px)'}}
sp.items.forEach(function(it,i){
var b=el('button','tab',it.label);b.type='button';b.setAttribute('aria-pressed',i===cur?'true':'false');
b.addEventListener('click',function(){
cur=i;
btns.forEach(function(t,j){t.setAttribute('aria-pressed',j===i?'true':'false')});
place();f.src=src(i);drawActs();
});
btns.push(b);tabs.appendChild(b);
});
box.appendChild(tabs);box.appendChild(f);
requestAnimationFrame(function(){place();requestAnimationFrame(function(){ind.classList.add('ready')})});
if(window.ResizeObserver)new ResizeObserver(place).observe(tabs);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(place);
}else{
box.className='glass player off';
box.appendChild(el('p',null,consent==='no'?'Spotify player is off because you rejected cookies.':'Accept cookies to show the Spotify player here.'));
var row=el('div','row');
var b2=el('button','btn small ghost','Show player');b2.type='button';
b2.addEventListener('click',function(){decide('yes')});
row.appendChild(b2);
box.appendChild(row);
}
}
renderers.push(draw);draw();drawActs();
wrap.appendChild(box);wrap.appendChild(acts);return wrap;
}

function decode(node,text,delay){
var chars='!<>-_/[]{}=+*^?#01',n=0,steps=10;
node.textContent=String.fromCharCode(160);
setTimeout(function(){
var iv=setInterval(function(){
n++;var out='';
for(var i=0;i<text.length;i++){out+=(i<Math.floor(text.length*n/steps)||text.charAt(i)===' ')?text.charAt(i):chars.charAt(Math.floor(Math.random()*chars.length))}
node.textContent=out;
if(n>=steps){clearInterval(iv);node.textContent=text}
},40);
},delay);
}
function booking(b){
var s=el('section');s.setAttribute('aria-label','Booking');
var t=el('button','btn big');t.type='button';
t.setAttribute('aria-expanded','false');t.setAttribute('aria-controls','book-opts');
t.appendChild(el('span',null,b.label||'Booking'));
var ar=el('span','arr',' ▾');ar.setAttribute('aria-hidden','true');t.appendChild(ar);
var wrap=el('div','book-wrap');wrap.id='book-opts';var panel=el('div','book-opts');wrap.appendChild(panel);var labels=[];
(b.options||[]).forEach(function(o,idx){
var href=o.url;
if(o.email){
href='mailto:'+o.email;var q=[];
if(o.subject)q.push('subject='+encodeURIComponent(o.subject));
if(o.body)q.push('body='+encodeURIComponent(o.body.replace(/\n/g,'\r\n')));
if(q.length)href+='?'+q.join('&');
}
var a=el('a','glass opt');a.href=href;a.style.setProperty('--i',idx);a.setAttribute('aria-label',o.label+(o.note?', '+o.note:''));
if(!o.email){a.target='_blank';a.rel='noopener noreferrer'}
var lb=el('b',null,o.label);a.appendChild(lb);labels.push([lb,o.label]);
if(o.note)a.appendChild(el('span',null,o.note));
panel.appendChild(a);
});
var tm=0;
t.addEventListener('click',function(){
var open=t.getAttribute('aria-expanded')==='true';
t.setAttribute('aria-expanded',open?'false':'true');
clearTimeout(tm);
if(open){wrap.classList.remove('open','done');return}
wrap.classList.add('open');
if(!reduce){t.classList.remove('ping');void t.offsetWidth;t.classList.add('ping');labels.forEach(function(p,i){decode(p[0],p[1],120+i*110)})}
tm=setTimeout(function(){wrap.classList.add('done')},reduce?0:620);
});
s.appendChild(t);s.appendChild(wrap);return s;
}

function video(s){
var c=el('article','glass vid');
var fb=el('button','facade');fb.type='button';fb.setAttribute('aria-label','Play: '+s.title);
var im=el('img');im.src=s.thumb||('https://i.ytimg.com/vi/'+s.youtube+'/hqdefault.jpg');im.alt='';im.loading='lazy';
fb.appendChild(im);fb.appendChild(el('span','play'));

function slideshow(b){
var host=document.getElementById('bg');
if(!host||!b||!b.items||!b.items.length)return;
var items=b.items,ms=(b.interval||7)*1000,slides=[];
host.style.setProperty('--dur',((ms+1800)/1000)+'s');
function mk(it){var d=el('div','s'),im=new Image();im.alt='';im.decoding='async';im.src=it.src;
var pos=it.pos||'50% 50%';im.style.objectPosition=pos;d.style.setProperty('--o',pos);d.appendChild(im);return d}
slides=[mk(items[0]),mk(items[items.length>1?1:0])];
slides.forEach(function(x){host.appendChild(x)});
slides[0].classList.add('on');if(!reduce)slides[0].classList.add('z');
if(items.length<2||reduce)return;
var cur=0,idx=0;
function next(){
if(document.hidden)return;
var nxt=1-cur,prev=slides[cur];idx=(idx+1)%items.length;
var upcoming=items[(idx)%items.length];
var d=mk(upcoming);host.replaceChild(d,slides[nxt]);slides[nxt]=d;
void d.offsetWidth;
d.classList.add('on','z');prev.classList.remove('on');
setTimeout(function(){prev.classList.remove('z')},1900);
cur=nxt;
var pre=new Image();pre.src=items[(idx+1)%items.length].src;
}
setInterval(next,ms);
}

fetch('links.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(d){

if(!reduce&&window.matchMedia&&matchMedia('(hover:hover) and (pointer:fine)').matches){

});
},{passive:true});
}
document.getElementById('cookie-settings').addEventListener('click',showBanner);
if(consent===null)showBanner();
